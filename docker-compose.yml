version: '3.8'

services:
  med-adn: # Change this to match the "Service Name" in your screenshot
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
      args:
        - NEXT_PUBLIC_API_URL=https://med-adn.com/api/v1
        - NEXT_PUBLIC_APP_URL=https://med-adn.com
        - NEXT_PUBLIC_APP_NAME=Med-ADN
    container_name: med-adn-production
    expose:
      - 3000
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    restart: unless-stopped
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true

volumes:
  uploads:
  logs: