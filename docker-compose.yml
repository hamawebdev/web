version: '3.8'

services:
  med-adn:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
      args:
        # These are critical for Next.js to work in the browser
        NEXT_PUBLIC_API_URL: https://med-adn.com/api/v1
        NEXT_PUBLIC_APP_URL: https://med-adn.com
        NEXT_PUBLIC_APP_NAME: med-adn
    container_name: med-adn-production
    # Tells Dokploy to listen internally on 3000
    expose:
      - 3000
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_DISABLE_CREDENTIALS=true
      - NEXT_PUBLIC_APP_NAME=med-adn
      - NEXT_PUBLIC_APP_VERSION=1.0.0
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    restart: unless-stopped

    # Use a simpler healthcheck or remove if you don't have /api/health
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - dokploy-network

networks:
  # This is the "bridge" that lets Dokploy see your app
  dokploy-network:
    external: true

volumes:
  uploads:
  logs: