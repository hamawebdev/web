version: '3.8'

services:
  med-adn:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
      args:
        # Crucial: These must be here for Next.js to bake them into the JS
        NEXT_PUBLIC_API_URL: https://med-adn.com/api/v1
        NEXT_PUBLIC_APP_URL: https://med-adn.com
        NEXT_PUBLIC_APP_NAME: med-adn
    container_name: med-adn-production
    # Use expose instead of ports to keep traffic internal to the dokploy-network
    expose:
      - 3000
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_DISABLE_CREDENTIALS=true
      - NEXT_PUBLIC_APP_NAME=med-adn
      - NEXT_PUBLIC_APP_VERSION=1.0.0
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    restart: unless-stopped
    networks:
      - dokploy-network

networks:
  # This matches your 'Scope: swarm' and 'Driver: overlay' configuration
  dokploy-network:
    external: true

volumes:
  uploads:
    driver: local
  logs:
    driver: local