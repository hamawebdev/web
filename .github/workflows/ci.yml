name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Runs on main are serialized so each deploy waits for the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/hamawebdev/web
  HEALTH_URL: https://med-adn.com/api/health
  # Public values baked into the client bundle (never secrets)
  NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.med-adn.com/api/v1' }}
  NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://med-adn.com' }}
  NEXT_PUBLIC_APP_NAME: ${{ vars.NEXT_PUBLIC_APP_NAME || 'Med-ADN' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=critical

  image:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=main,enable={{is_default_branch}}
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: local/web:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_URL=${{ env.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_APP_NAME=${{ env.NEXT_PUBLIC_APP_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check the image for secrets
        run: bash .github/scripts/scan-image-secrets.sh local/web:ci /app
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_URL=${{ env.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_APP_NAME=${{ env.NEXT_PUBLIC_APP_NAME }}
          cache-from: type=gha

  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Dokploy only pulls the image built above and restarts the service (a few minutes)
    timeout-minutes: 30
    steps:
      - name: Trigger Dokploy deployment
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          live=$(curl -fsS --max-time 10 "$HEALTH_URL" | jq -r '.commit // empty' || true)
          if [ "$live" = "$GITHUB_SHA" ]; then
            echo "Already live at $GITHUB_SHA; not triggering another deployment"
            exit 0
          fi
          body=$(jq -n --arg id "$GITHUB_SHA" --arg message "${COMMIT_MESSAGE%%$'\n'*}" \
            '{ref: "refs/heads/main", head_commit: {id: $id, message: $message}, commits: []}')
          curl -fsS --retry 3 -X POST "$DOKPLOY_DEPLOY_WEBHOOK" \
            -H 'Content-Type: application/json' -H 'x-github-event: push' -d "$body"
      - name: Wait until the new version is healthy
        run: |
          for i in $(seq 1 50); do
            commit=$(curl -fsS --max-time 10 "$HEALTH_URL" | jq -r '.commit // empty' || true)
            if [ "$commit" = "$GITHUB_SHA" ]; then
              echo "Live and healthy at $GITHUB_SHA"
              exit 0
            fi
            echo "Waiting (live commit: ${commit:-none})"
            sleep 30
          done
          echo "::error::$GITHUB_SHA did not become healthy at $HEALTH_URL"
          exit 1
